spring.application.name=naviserver
kakao.rest.api.key=${KAKAO_REST_KEY}

# 정밀도로지도 DB (PostgreSQL + PostGIS + pgRouting)
# DB_PASSWORD는 IntelliJ Run Configuration의 환경변수로 넣는다. URL/계정은 다르면 환경변수로 바꿀 수 있다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lanenavi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# 차로 계산 쿼리는 짧게 끝나는데 PostgreSQL JIT가 켜지면 컴파일에만 2~3초를 쓴다
spring.datasource.hikari.connection-init-sql=SET jit = off

# 현재 차로 임시값 (AI 연동 전까지 사용, 왼쪽부터 1번)
navi.placeholder-current-lane=2
