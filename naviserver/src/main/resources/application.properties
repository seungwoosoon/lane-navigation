spring.application.name=naviserver
kakao.rest.api.key=${KAKAO_REST_KEY}

# 정밀도로지도 DB (PostgreSQL + PostGIS + pgRouting)
# DB_PASSWORD는 IntelliJ Run Configuration의 환경변수로 넣는다. URL/계정은 다르면 환경변수로 바꿀 수 있다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lanenavi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# 차로 계산 쿼리는 짧게 끝나는데 PostgreSQL JIT가 켜지면 컴파일에만 2~3초를 쓴다
spring.datasource.hikari.connection-init-sql=SET jit = off

# Lane AI (현재 차로 추정). lane-ai/scripts/serve_lane_replay.py 를 먼저 띄운다.
# AI가 꺼져 있으면 현재 차로 없이(목표 차로만) 안내를 계속한다.
lane-ai.enabled=${LANE_AI_ENABLED:true}
lane-ai.base-url=${LANE_AI_URL:http://127.0.0.1:8765}
lane-ai.timeout-ms=500

# 주행 기록 재생: recording.json 과 gps.csv 가 있는 세션 폴더 (예: C:/lane-navigation/lane-ai/data/drives/drive_20261124_172325)
# 비워 두면 재생을 쓰지 않는다. 앱은 local.properties 에 REPLAY_MODE=true 를 넣으면 이 GPS 기록으로 달린다.
navi.replay.session-dir=${REPLAY_SESSION_DIR:}

# 현재 차로 임시값 (왼쪽부터 1번). 0 이면 쓰지 않는다 → AI가 모르면 목표 차로만 안내
navi.placeholder-current-lane=0
